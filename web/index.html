<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chzzk Look</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="loading">
<div class="app">
  <aside class="side">
    <fieldset id="apiBox">
      <legend>API</legend>
      <label class="row"><span>Client ID</span><input id="client_id" autocomplete="off" spellcheck="false" /></label>
      <label class="row"><span>Secret</span><input id="client_secret" type="password" autocomplete="off" spellcheck="false" /></label>
      <div class="row sub">
        <label><input type="checkbox" id="save_secret" /> Secret 저장</label>
        <label><input type="checkbox" id="showSecret" /> 보기</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>카테고리 / 태그</legend>
      <div class="cats" id="catBtns"></div>
      <div class="row">
        <input id="category" list="catList" spellcheck="false" placeholder="쉼표로 여러 개 (비우면 전체)"
               title="쉼표로 여러 개 넣으면 그 중 하나라도 맞는 방송 (예: 토크, 마인크래프트)" />
        <button type="button" id="refreshCats" title="지금 방송 중인 카테고리 목록 받아오기">목록</button>
      </div>
      <datalist id="catList"></datalist>
      <div class="row">
        <span>태그</span>
        <input id="tags" spellcheck="false" placeholder="발로란트, 시참" title="쉼표로 여러 개. 태그 일부만 맞아도 인정 (대소문자 무시)" />
      </div>
      <div class="row sub">
        <label><input type="radio" name="tag_mode" value="all" /> 모두 포함</label>
        <label><input type="radio" name="tag_mode" value="any" /> 하나라도</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>조건</legend>
      <div class="row cond" data-filter="viewer">
        <label><input type="checkbox" id="viewer_enabled" /> 시청자</label>
        <input id="min_viewers" class="num" inputmode="numeric" /> ~ <input id="max_viewers" class="num" inputmode="numeric" />
      </div>
      <div class="row cond" data-filter="follower">
        <label><input type="checkbox" id="follower_enabled" /> 팔로워</label>
        <input id="min_followers" class="num" inputmode="numeric" /> ~ <input id="max_followers" class="num" inputmode="numeric" />
      </div>
      <div class="row cond" data-filter="uptime">
        <label><input type="checkbox" id="uptime_enabled" /> 방송시간</label>
        <input id="max_uptime_hours" class="num" inputmode="decimal" /> 시간 이하
      </div>
      <div class="row cond">
        <label>최대 스캔</label>
        <input id="max_total" class="num wide" inputmode="numeric" /> 개
      </div>
    </fieldset>

    <fieldset class="grow">
      <legend>패스 목록 (<span id="skipCount">0</span>) · skip.txt</legend>
      <textarea id="skip_urls_text" spellcheck="false" wrap="off" placeholder="https://chzzk.naver.com/live/... 한 줄에 하나"></textarea>
      <div class="row">
        <label class="btn">파일 불러오기<input type="file" id="skipFile" accept=".txt,text/plain" hidden /></label>
        <button type="button" id="clearSkip">비우기</button>
      </div>
    </fieldset>

    <div class="actions">
      <button type="button" class="go" id="searchBtn" disabled>검색 (Ctrl+Enter)</button>
      <button type="button" class="stop hidden" id="stopBtn">중지</button>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <label>정렬
        <select id="sort">
          <option value="viewers">시청자 적은 순</option>
          <option value="followers">팔로워 적은 순</option>
          <option value="recent">최근 시작 순</option>
          <option value="name">채널 이름 순</option>
        </select>
      </label>
      <span class="sep"></span>
      <span class="toggle" id="viewBtns">
        <button type="button" data-view="grid">격자</button><button type="button" data-view="list">목록</button>
      </span>
      <span class="sep"></span>
      <label>찾기 <input id="q" spellcheck="false" placeholder="채널/제목/태그" /></label>
      <span class="count" id="count"></span>
    </div>

    <div class="content" id="content">
      <div id="results"></div>
      <div class="empty" id="empty"></div>
    </div>
  </main>
</div>

<div class="statusbar">
  <span id="status">설정 불러오는 중...</span>
  <span id="statusAction"></span>
  <label class="dbg" title="켜면 검색 과정과 오류를 debug.log 파일에 기록합니다"><input type="checkbox" id="debug_log" /> 디버그 로그 (debug.log)</label>
</div>

<script src="app.js"></script>
</body>
</html>
